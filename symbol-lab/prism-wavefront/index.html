<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Prism wavefront studies</title>
    <style>
      :root {
        --bg: #f4f1ea;
        --ink: #151515;
        --muted: #666158;
        --line: rgba(21, 21, 21, 0.14);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      main {
        width: min(1180px, calc(100% - 28px));
        margin: 0 auto;
        padding: 34px 0 72px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 4vw, 3.2rem);
        font-weight: 680;
        letter-spacing: 0;
      }

      .note {
        max-width: 520px;
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
        font-size: 0.98rem;
      }

      .study {
        padding: 34px 0 44px;
        border-bottom: 1px solid var(--line);
      }

      .study-head {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: baseline;
        margin-bottom: 14px;
      }

      h2 {
        margin: 0;
        font-size: clamp(1.12rem, 2vw, 1.55rem);
        font-weight: 620;
        letter-spacing: 0;
      }

      a {
        color: var(--ink);
        text-underline-offset: 3px;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        background: #fff;
        border: 1px solid var(--line);
      }

      @media (max-width: 720px) {
        header,
        .study-head {
          display: block;
        }

        .note,
        .study-head a {
          display: block;
          margin-top: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Prism wavefront studies</h1>
        <p class="note">Wavefront crest plots for a microrealist prism motif. The prism outline is not drawn; it appears through phase kinks and crest density.</p>
      </header>

      <section class="study">
        <div class="study-head">
          <h2>Default</h2>
          <a href="assets/default.svg">Open editable SVG</a>
        </div>
        <img src="assets/default.png" alt="Default prism wavefront render" />
      </section>

      <section class="study">
        <div class="study-head">
          <h2>Minimal</h2>
          <a href="assets/minimal.svg">Open editable SVG</a>
        </div>
        <img src="assets/minimal.png" alt="Minimal prism wavefront render" />
      </section>

      <section class="study">
        <div class="study-head">
          <h2>Dramatic</h2>
          <a href="assets/dramatic.svg">Open editable SVG</a>
        </div>
        <img src="assets/dramatic.png" alt="Dramatic prism wavefront render" />
      </section>
    </main>
  </body>
</html>
