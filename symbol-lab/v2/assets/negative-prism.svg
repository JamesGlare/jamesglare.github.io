<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" fill="none">
  <defs>
    <linearGradient id="prismGlass" x1="58" y1="34" x2="162" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6f2f5" stop-opacity="0.18"/>
      <stop offset="0.48" stop-color="#f1d7e5" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#9ca3af" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="edgeGlow" x1="58" y1="128" x2="162" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0a9c8" stop-opacity="0.72"/>
      <stop offset="0.46" stop-color="#edf0f4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9aa1ad" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="rayIn" x1="6" y1="80" x2="86" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbff" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#f8fbff" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#f8fbff" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="rayOutPink" x1="135" y1="76" x2="216" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4a7c5" stop-opacity="0.66"/>
      <stop offset="0.6" stop-color="#f4a7c5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f4a7c5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayOutGrey" x1="135" y1="80" x2="216" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e9edf3" stop-opacity="0.58"/>
      <stop offset="0.6" stop-color="#aeb6c2" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#aeb6c2" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGhost" x="-20%" y="-40%" width="140%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <style>
    .ray {
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: prismRayPulse 5.8s ease-in-out infinite;
      transform-origin: 110px 80px;
    }

    .ray-delay-1 { animation-delay: -1.4s; }
    .ray-delay-2 { animation-delay: -2.8s; }
    .ray-delay-3 { animation-delay: -4.2s; }

    .ghost {
      animation: prismGhostDrift 7.5s ease-in-out infinite;
      transform-origin: 110px 80px;
    }

    @keyframes prismRayPulse {
      0%, 100% {
        opacity: 0.12;
        stroke-dashoffset: 22;
      }
      43% {
        opacity: 0.84;
        stroke-dashoffset: 0;
      }
      72% {
        opacity: 0.28;
      }
    }

    @keyframes prismGhostDrift {
      0%, 100% {
        opacity: 0.42;
        transform: translateY(0);
      }
      50% {
        opacity: 0.72;
        transform: translateY(-1.8px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ray,
      .ghost {
        animation: none;
      }
    }
  </style>

  <path class="ghost" d="M58 128 L110 38 L162 128 Z" fill="url(#prismGlass)" filter="url(#softGhost)"/>
  <path d="M58 128 L110 38 L162 128 Z" fill="url(#prismGlass)" stroke="url(#edgeGlow)" stroke-width="1.65" stroke-linejoin="round"/>
  <path d="M76 118 L110 59 L144 118 Z" stroke="#f8fbff" stroke-opacity="0.18" stroke-width="0.9" stroke-linejoin="round"/>

  <path class="ray" d="M8 82 C30 79, 54 78, 84 79" stroke="url(#rayIn)" stroke-width="2.1" stroke-dasharray="14 12"/>
  <path class="ray ray-delay-1" d="M9 91 C35 88, 58 84, 84 79" stroke="url(#rayIn)" stroke-width="1.15" stroke-dasharray="10 12"/>
  <path class="ray ray-delay-2" d="M136 76 C160 67, 183 57, 215 48" stroke="url(#rayOutPink)" stroke-width="2.2" stroke-dasharray="13 13"/>
  <path class="ray ray-delay-3" d="M136 79 C162 77, 186 75, 215 70" stroke="url(#rayOutPink)" stroke-width="1.35" stroke-dasharray="8 11"/>
  <path class="ray ray-delay-1" d="M136 83 C162 90, 185 100, 215 113" stroke="url(#rayOutGrey)" stroke-width="1.8" stroke-dasharray="12 13"/>
  <path class="ray ray-delay-2" d="M136 86 C160 98, 184 114, 210 134" stroke="url(#rayOutGrey)" stroke-width="1.05" stroke-dasharray="8 12"/>

  <path d="M84 79 C99 83, 117 82, 136 76" stroke="#f0a9c8" stroke-opacity="0.34" stroke-width="1.15" stroke-linecap="round"/>
  <path d="M84 79 C101 76, 117 77, 136 86" stroke="#e9edf3" stroke-opacity="0.28" stroke-width="0.9" stroke-linecap="round"/>
  <circle cx="110" cy="38" r="1.6" fill="#f3adc9" fill-opacity="0.72"/>
</svg>
