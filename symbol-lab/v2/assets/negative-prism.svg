<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" fill="none">
  <defs>
    <linearGradient id="prismGlass" x1="58" y1="34" x2="162" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6f2f5" stop-opacity="0.22"/>
      <stop offset="0.48" stop-color="#f1d7e5" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#9ca3af" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="edgeGlow" x1="58" y1="128" x2="162" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0a9c8" stop-opacity="0.72"/>
      <stop offset="0.46" stop-color="#edf0f4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9aa1ad" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="rayIn" x1="6" y1="80" x2="91" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbff" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#f8fbff" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#f8fbff" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="rayInside" x1="84" y1="80" x2="132" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#f4a7c5" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f4a7c5" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="rayExit" x1="136" y1="128" x2="70" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4a7c5" stop-opacity="0.48"/>
      <stop offset="0.42" stop-color="#e9edf3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#aeb6c2" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGhost" x="-20%" y="-40%" width="140%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <style>
    .ray {
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: prismRayPulse 5.8s ease-in-out infinite;
      transform-origin: 110px 80px;
    }

    .ray-delay-1 { animation-delay: -1.4s; }
    .ray-delay-2 { animation-delay: -2.8s; }
    .ray-delay-3 { animation-delay: -4.2s; }

    .ghost {
      animation: prismGhostDrift 7.5s ease-in-out infinite;
      transform-origin: 110px 80px;
    }

    @keyframes prismRayPulse {
      0%, 100% {
        opacity: 0.12;
        stroke-dashoffset: 22;
      }
      43% {
        opacity: 0.84;
        stroke-dashoffset: 0;
      }
      72% {
        opacity: 0.28;
      }
    }

    @keyframes prismGhostDrift {
      0%, 100% {
        opacity: 0.42;
        transform: translateY(0);
      }
      50% {
        opacity: 0.72;
        transform: translateY(-1.8px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ray,
      .ghost {
        animation: none;
      }
    }
  </style>

  <path class="ghost" d="M58 128 L110 38 L162 128 Z" fill="url(#prismGlass)" filter="url(#softGhost)"/>
  <path d="M58 128 L110 38 L162 128 Z" fill="url(#prismGlass)" stroke="url(#edgeGlow)" stroke-width="1.65" stroke-linejoin="round"/>
  <path d="M76 118 L110 59 L144 118 Z" stroke="#f8fbff" stroke-opacity="0.18" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M103 92 H117" stroke="#f3adc9" stroke-opacity="0.46" stroke-width="1.25" stroke-linecap="round"/>
  <path d="M116 98 C120 101, 124 105, 128 109" stroke="#f8fbff" stroke-opacity="0.18" stroke-width="0.85" stroke-linecap="round"/>
  <path d="M109 104 C113 107, 117 111, 121 115" stroke="#f8fbff" stroke-opacity="0.14" stroke-width="0.85" stroke-linecap="round"/>

  <path class="ray ray-delay-1" d="M8 72 L90.4 72" stroke="url(#rayIn)" stroke-width="1.05" stroke-dasharray="10 12"/>
  <path class="ray ray-delay-1" d="M90.4 72 L135.8 128" stroke="url(#rayInside)" stroke-width="1.05" stroke-dasharray="10 12"/>
  <path class="ray ray-delay-1" d="M135.8 128 L87.3 153.9" stroke="url(#rayExit)" stroke-width="1.05" stroke-dasharray="10 12"/>

  <path class="ray" d="M8 80 L85.7 80" stroke="url(#rayIn)" stroke-width="2.05" stroke-dasharray="14 12"/>
  <path class="ray" d="M85.7 80 L124.7 128" stroke="url(#rayInside)" stroke-width="2.05" stroke-dasharray="14 12"/>
  <path d="M124.7 128 C143 126, 160 123, 178 118" stroke="#e9edf3" stroke-opacity="0.13" stroke-width="0.9" stroke-dasharray="2 7" stroke-linecap="round"/>
  <path class="ray" d="M124.7 128 L76.2 153.9" stroke="url(#rayExit)" stroke-width="2.05" stroke-dasharray="14 12"/>

  <path class="ray ray-delay-3" d="M8 88 L81.1 88" stroke="url(#rayIn)" stroke-width="1.2" stroke-dasharray="8 11"/>
  <path class="ray ray-delay-3" d="M81.1 88 L113.6 128" stroke="url(#rayInside)" stroke-width="1.2" stroke-dasharray="8 11"/>
  <path class="ray ray-delay-3" d="M113.6 128 L65 153.9" stroke="url(#rayExit)" stroke-width="1.2" stroke-dasharray="8 11"/>

  <path d="M85.7 80 L124.7 128" stroke="#f0a9c8" stroke-opacity="0.28" stroke-width="0.9" stroke-linecap="round"/>
  <circle cx="85.7" cy="80" r="1.15" fill="#f8fbff" fill-opacity="0.42"/>
  <circle cx="124.7" cy="128" r="1.25" fill="#f3adc9" fill-opacity="0.5"/>
  <circle cx="110" cy="38" r="1.6" fill="#f3adc9" fill-opacity="0.72"/>
</svg>
