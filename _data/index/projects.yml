- name: Analog-Optical Computer for AI Inference
  i18n:
  url: https://www.nature.com/articles/s41586-025-09430-z
  img: /static/assets/img/landing/aoc_pic.png 
  desc: >
    GPUs have enabled and fuelled the AI wave. However, their compute effiency is stagnant when normalized over precision, leading to an increasingly larger electricity footprint of AI.
    Analog computation promises to increase efficiency somewhat but is insufficient in and of itself since data movement is usually the expensive part of the compute operation.
    Optics has long been used as a means to transmit information independent of distance. In this work, we seek to combine the benefits of optics with analog computation to accelerate AI models and certain classes of optimization problems.
    A change in compute architecture necessitates and enables changes in model architecture. Here, we propose a class of fixed-point AI models (see our ICML paper below) to run on our self-built computer. 
    We show that these models can be correctly evaluated on our machine. Further, we show that this compute design could reach up to a 100x improvement in Flops/W compared to current state-of-the-art GPUs.
- name: Implicit Languagemodels are RNN: Balancing Parallelization and Expressivity
  i18n:
  url: https://openreview.net/forum?id=5EbiopWH6e
  img: static/assets/img/landing/implicit_languagemodels.png
  desc: >
    State-space models (SSMs) and transformers dominate the language modeling landscape. However, they are constrained to a lower computational complexity than classical recurrent neural networks (RNNs), limiting their expressivity.
    In contrast, RNNs lack parallelization during training, raising fundamental questions about the trade off between parallelization and expressivity. We propose implicit SSMs, which iterate a transformation until convergence to a fixed point.
    Theoretically, we show that implicit SSMs implement the non-linear state-transitions of RNNs. Empirically, we find that only approximate fixed-point convergence suffices, enabling the design of a scalable training curriculum that largely retains parallelization,
    with full convergence required only for a small subset of tokens. Our approach demonstrates superior state-tracking capabilities on regular languages, surpassing transformers and SSMs.
    We further scale implicit SSMs to natural language reasoning tasks and pretraining of large-scale language models up to 1.3B parameters on 207B tokens - representing, to our knowledge, the largest implicit model trained to date.
    Notably, our implicit models outperform their explicit counterparts on standard benchmarks. Our code is publicly available at github.com/microsoft/implicit_languagemodels
- name: Inverse digital holography using conditional generative models
  i18n: 
  url: 
  gh_user: JamesGlare
  repo: Neural-Net-LabView-DLL
  img: /static/assets/img/landing/holo_grab.jpg
  desc: >
    While holograms constitute powerful optical instruments, it can be difficult to find a suitable hologram for a given task.
    For instance, in holographic optical tweezers, holograms are used to shape laser light that is then used to exert forces on microscopic particles.
    While there are numerous algorithms for finding holograms, few are geared towards producing small laser patterns with high accuracy.
    Here, I explore conditional generative models for phase-retrival in digital holography. 
    <a href="https://arxiv.org/abs/1911.00904"> Read the preprint.</a> 

- name: Faster-than-free-diffusion reaction rates - Optimising Kramers problem
  i18n: 
  gh_user: 
  repo: 
  img: /static/assets/img/landing/kramers_speed_up_pic.jpg
  desc: >
    Kramers' theory provides a comprehensive framework for thermally-activated reactions. 
    Crucially, it explains the Arrhenius-like scaling of reaction rates in the limit of high activation-energy barriers.
    Following theoretical predictions by my coauthors, I show experimentally that for certain barrier shapes, this scaling law is inverted. 
    In other words, reaction rates may actually increase with increasing barrier height.
    In my experiments, I construct fine-tuned barriers using an automated holographic optical tweezers setup and measure the
    mean first-passage time of escape. <a href="https://www.pnas.org/content/early/2019/12/13/1910677116"> Read the paper...</a> <a href="https://www.pnas.org/content/early/2020/01/13/1921425117.full"> or a commentary (open access). </a> 

- name: <td>Fick-Jacobs</td> theory and entropic transport in microfluidic systems
  i18n: 
  gh_user: 
  repo: 
  img: /static/assets/img/landing/particleInCorrugatedChannel.jpg
  desc: >
    Microfluidic channels that vary in width provide a simple toy model for entropically-driven transport. 
    Entropic forces cause Brownian transitions across constrictions to be shorter than across straight parts of a channel. Crucially, in microfluidic channels, the hydrodynamic friction a particle experiences depends on its proximity to obstructions.
    When this effect is accounted for, mean first-passage times adhere closely to Fick-Jacobs predictions, which are based on a free-energy that is 
    marginalised along the lateral direction. <a href=""> More coming soon...</a> 


- name: Experimental evidence of symmetry breaking of transition-path times
  i18n: 
  gh_user: 
  repo: 
  url: 
  img: /static/assets/img/landing/path_times.png
  desc: >
    Various first-passage times adhere to a fundamental inversion symmetry, which is related to microscopic reversibility. 
    For instance, the mean time of escape from a 1D interval [<i>a</i>,<i>b</i>] when initialised in the centre, <i>x<sub>0</sub>=(a+b)/2</i>, is equivalent at both exits: <i>a</i> and <i>b</i>. 
    Crucially, this remains so under the influence of a (constant) drift-force <i> f(x)=f<sub>0</sub></i>. 
    In our paper, we systematically explore this symmetry and demonstrate how it can break down on the meso- and molecular scale. 
    We furthermore provide examples how this might be useful for analyzing molecular processes. 
    <a href="https://www.nature.com/articles/s41467-018-07873-9"> Read the paper (open access). </a>

- name: Broken detailed balance and non-equilibrium dynamics in living systems
  i18n: 
  gh_user: 
  repo: 
  url: 
  img: /static/assets/img/landing/review_pic.jpg
  desc: >
    Living systems operate far from thermodynamic equilibrium. Enzymatic activity can induce broken detailed balance at the molecular scale. 
    This breakdown of detailed balance is crucial to achieve biological functions such as high-fidelity transcription and translation, 
    sensing, adaptation, biochemical patterning, and force generation. While biological systems such as motor enzymes violate detailed balance at 
    the molecular scale, it remains unclear how non-equilibrium dynamics [...]
    <a href="https://iopscience.iop.org/article/10.1088/1361-6633/aab3ed/meta"> Read the review article (open access). </a>

- name: Broken detailed balance of filament dynamics in active networks
  i18n: 
  gh_user: 
  repo: 
  url: 
  img: /static/assets/img/landing/detailed_balance_prl.jpg
  desc: >
    Myosin motor proteins drive vigorous steady-state fluctuations in the actin cytoskeleton of cells. 
    Endogenous embedded semiflexible filaments such as microtubules, or added filaments such as single-walled carbon nanotubes 
    are used as novel tools to noninvasively track equilibrium and nonequilibrium fluctuations in such biopolymer networks. 
    Here, we analytically calculate shape fluctuations of semiflexible probe filaments in a viscoelastic environment, 
    driven out of equilibrium by motor activity. [...]
