<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" fill="none" role="img" aria-labelledby="prism-title prism-description">
  <title id="prism-title">Negative refraction</title>
  <desc id="prism-description">Three parallel rays enter a triangular negative-index prism from the left, bend downwards inside it, and emerge towards the lower left. Bone-coloured incident light turns warm copper inside the prism.</desc>
  <defs>
    <linearGradient id="glass" x1="65" y1="50" x2="155" y2="135" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eeeae4" stop-opacity=".015"/>
      <stop offset="1" stop-color="#dbb0a0" stop-opacity=".065"/>
    </linearGradient>
    <linearGradient id="edge" x1="58" y1="128" x2="162" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dbb0a0" stop-opacity=".56"/>
      <stop offset=".55" stop-color="#eeeae4" stop-opacity=".7"/>
      <stop offset="1" stop-color="#eeeae4" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="incident" x1="8" y1="80" x2="91" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eeeae4" stop-opacity="0"/>
      <stop offset=".35" stop-color="#eeeae4" stop-opacity=".48"/>
      <stop offset="1" stop-color="#eeeae4" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="emergent" x1="129" y1="126" x2="77" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dbb0a0" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#dbb0a0" stop-opacity=".48"/>
      <stop offset="1" stop-color="#dbb0a0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Preserve the original ray geometry; change only its visual treatment. -->
  <path d="M58 128 L110 38 L162 128 Z" fill="url(#glass)" stroke="url(#edge)" stroke-width=".8" stroke-linejoin="round"/>

  <!-- Faint interface normals make the sign of refraction legible. -->
  <g stroke="#adb1b2" stroke-opacity=".22" stroke-width=".45" stroke-dasharray="2 3">
    <path d="M68.4 70 L103 90"/>
    <path d="M124.7 116 V143"/>
  </g>

  <g stroke-linecap="round" stroke-linejoin="round">
    <g opacity=".35" stroke-width=".55">
      <path d="M8 72 H90.4" stroke="url(#incident)"/>
      <path d="M90.4 72 L135.8 128" stroke="#dbb0a0"/>
      <path d="M135.8 128 L87.3 153.9" stroke="url(#emergent)"/>
      <path d="M8 88 H81.1" stroke="url(#incident)"/>
      <path d="M81.1 88 L113.6 128" stroke="#dbb0a0"/>
      <path d="M113.6 128 L65 153.9" stroke="url(#emergent)"/>
    </g>
    <path d="M8 80 H85.7" stroke="url(#incident)" stroke-width=".9"/>
    <path d="M85.7 80 L124.7 128" stroke="#dbb0a0" stroke-opacity=".82" stroke-width=".9"/>
    <path d="M124.7 128 L76.2 153.9" stroke="url(#emergent)" stroke-width=".9"/>
    <path d="M47 78 L50 80 L47 82" stroke="#eeeae4" stroke-opacity=".65" stroke-width=".65"/>
    <path d="M103 136.9 L101 140.7 L105.3 141.2" stroke="#dbb0a0" stroke-opacity=".55" stroke-width=".65"/>
  </g>

  <path d="M105.5 73 H113.5" stroke="#dbb0a0" stroke-opacity=".65" stroke-width=".85" stroke-linecap="round"/>
  <circle cx="85.7" cy="80" r="1" fill="#eeeae4" fill-opacity=".8"/>
  <circle cx="124.7" cy="128" r="1" fill="#dbb0a0" fill-opacity=".9"/>
</svg>
